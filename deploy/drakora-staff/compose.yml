name: drakora_staff
services:
  staff:
    build: .
    image: drakora-staff:1
    container_name: drakora-staff
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8088:3000"]
    volumes:
      - ${STAFF_DATA_PATH:?Set STAFF_DATA_PATH}:/data
      - ${STAFF_CONFIG_PATH:?Set STAFF_CONFIG_PATH}:/run/secrets/config.json:ro
    networks: [huly]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
networks:
  huly:
    external: true
    name: ${HULY_NETWORK:?Set HULY_NETWORK}
